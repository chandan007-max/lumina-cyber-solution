services:
  - type: web
    name: lumina-cyber-solution
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npx tsx server.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: LUMINA_VAULT_MASTER_KEY
        generateValue: true
      - key: LUMINA_ADMIN_KEY
        generateValue: true

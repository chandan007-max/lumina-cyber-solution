services:
  - type: web
    name: lumina-cyber-solution
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: LUMINA_VAULT_MASTER_KEY
        generateValue: true
      - key: LUMINA_ADMIN_KEY
        generateValue: true
